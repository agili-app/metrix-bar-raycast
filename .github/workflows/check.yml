name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.19.1 --registry=https://registry.npmjs.org/
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
